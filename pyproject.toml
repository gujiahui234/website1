[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alt-web01"
version = "0.3.1"
description = "A demonstration framework for simulating university enrollment and graduation."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "alt_web01 contributors" }]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
    "PyMySQL>=1.1,<2",
    "celery[redis]>=5.6,<6",
    "python-dotenv>=1.1,<2",
    "httpx>=0.27",
    # Plain version constraints (no git+https direct URLs): these packages
    # ship as pre-built wheels in wheelhouse/ (see Dockerfile) because some
    # build hosts cannot reach github.com.
    "class-roster-simulator>=0.2.1",
    "sclog-lite>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8,<9",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/gujiahui234/website1"

[tool.hatch.build.targets.wheel]
packages = ["src/alt_web01"]

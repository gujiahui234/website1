services:
  web:
    build:
      context: .
      network: host
    ports:
      - "8800:8000"
    environment:
      STUDENT_STORE: mysql
      MYSQL_HOST: mysql-server
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-test_db}"
      MYSQL_USER: "${MYSQL_USER:-test_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:?CELERY_BROKER_URL must be set in .env}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must be set in .env}"
      MYSQL_WEB_HOST: "${MYSQL_WEB_HOST:-mysql-server}"
      MYSQL_WEB_PORT: "${MYSQL_WEB_PORT:-3306}"
      MYSQL_WEB_DATABASE: "${MYSQL_WEB_DATABASE:-web_db}"
      MYSQL_WEB_USER: "${MYSQL_WEB_USER:-web_user}"
      MYSQL_WEB_PASSWORD: "${MYSQL_WEB_PASSWORD:?MYSQL_WEB_PASSWORD must be set in .env}"
      # 学生 API 服务器（poc4-students-api）调试与文档地址
      API_SERVER_DOCS: "${API_SERVER_DOCS:-http://192.168.220.134:8001/docs}"
      API_SERVER_REDOC: "${API_SERVER_REDOC:-http://192.168.220.134:8001/redoc}"
      API_SERVER_JSON: "${API_SERVER_JSON:-http://192.168.220.134:8001/openapi.json}"
      # Celery 任务平台 API 服务器（alt_celery3，run_api.py）
      API_SERVER_TASKS: "${API_SERVER_TASKS:-http://192.168.220.134:8001/api/tasks}"
    networks:
      - default
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
